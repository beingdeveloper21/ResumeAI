version: '3.8'

services:
  resumeai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resumeai-production
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEBUG=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=gpt-4o-mini
      - SENTENCE_TRANSFORMER_MODEL=all-MiniLM-L6-v2
    restart: unless-stopped
