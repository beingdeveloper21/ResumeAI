services:
  - type: web
    name: resumeai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: DEBUG
        value: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SENTENCE_TRANSFORMER_MODEL
        value: all-MiniLM-L6-v2
